<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バーコードリーダー試作</title>
    <!-- QuaggaJSの読み込み (CDNを利用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        /* カメラ映像を表示するエリアのスタイル */
        #interactive.viewport {
            width: 100%;
            max-width: 640px;
            height: auto;
            overflow: hidden;
            position: relative;
        }
        #interactive.viewport canvas, video {
            width: 100%;
            height: auto;
        }
        /* 読み取り結果の表示エリア */
        #result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            font-size: 1.2rem;
            font-weight: bold;
        }
        /* ★更新日時を表示するエリアのスタイル */
        #update-time {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #666;
            border-top: 1px dashed #ccc;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <h1>バーコードリーダー テスト</h1>
    
    <!-- カメラ映像がここにリアルタイムで表示されます -->
    <div id="interactive" class="viewport"></div>

    <!-- 読み取った結果を表示する場所 -->
    <div id="result-box">
        読み取り結果: <span id="result">まだ読み取っていません</span>
    </div>

    <!-- ★ここに最終更新日時が自動挿入されます -->
    <div id="update-time">
        ページ最終更新日時: <span id="last-modified">取得中...</span>
    </div>

    <script>
        // ★【追加機能】ページの最終更新日時を自動で取得して表示する
        // ※document.lastModified は「月/日/年 時:分:秒」の形式で返ってくるため、少し見やすく整形します
        const modifiedDate = new Date(document.lastModified);
        const year = modifiedDate.getFullYear();
        const month = String(modifiedDate.getMonth() + 1).padStart(2, '0');
        const date = String(modifiedDate.getDate()).padStart(2, '0');
        const hours = String(modifiedDate.getHours()).padStart(2, '0');
        const minutes = String(modifiedDate.getMinutes()).padStart(2, '0');
        const seconds = String(modifiedDate.getSeconds()).padStart(2, '0');
        
        // 画面の「last-modified」の部分を書き換える
        document.getElementById('last-modified').textContent = `${year}/${month}/${date} ${hours}:${minutes}:${seconds}`;

        // QuaggaJSの設定と起動
        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: document.querySelector('#interactive'),
                constraints: {
                    width: 640,
                    height: 480,
                    facingMode: "environment", // 背面カメラを指定
                    advanced: [
                        { zoom: 3カメラが起動するようになったんですが、倍率が変わっていないように感じます。.0 } // 2.0倍ズーム
                    ]
                },
            },
            decoder: {
                readers: ["ean_reader"]
            }
        }, function(err) {
            if (err) {
                console.error(err);
                alert("カメラの起動に失敗しました: " + err);
                return;
            }
            console.log("Quaggaの初期化が成功しました。");
            Quagga.start();
        });

        // バーコードが読み取れた時の処理
        Quagga.onDetected(function(data) {
            const code = data.codeResult.code;
            document.getElementById('result').textContent = code;
        });
    </script>
</body>
</html>
